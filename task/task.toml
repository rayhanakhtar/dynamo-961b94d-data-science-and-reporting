artifacts = ["/app/output/daily_room_capacity_facts.csv", "/app/output/quality_summary.json"]  # paths the verifier reads from the agent (e.g. ["/app/output.json"]) — must be above the first [section]

[task]
name = "dynamo/room-capacity-facts"  # required format: org/name (Harbor needs the slash); name part lowercase kebab-case, <=3 words
description = "Compute per-room daily blocked minutes from an ambulatory scheduling export and emit a quality summary"                 # one-line summary of the task

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Science and Reporting"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Dataset preparation for analysis"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["implement", "fix", "transform", "validate", "generate"]                # e.g. ["implement", "debug"]
artifact_type = ["single_script_or_program", "dataset_or_tabular_file", "generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 6     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "The export mixes many revision states (amendments, cancellations, re-bookings, voided maximum revisions, and same-revision collisions) and capacity is defined over one shared room+clinic timeline. The contract (sections 7, 12, 13) requires skipping voided revisions when resolving each booking's current state and taking a strict union of all overlapping active bookings across providers/sources on the same room; a provider-partitioned sum of durations is a natural-looking but wrong model. Structurally plausible pipelines pass every schema, type, sort, and identity check while still failing dozens of exact cells, so agents must reason from the contract rather than from plausibility or the visible data alone. The export is synthetic but realistic, modeled on real ambulatory scheduling exports with its revision and overlap states planted deliberately. It represents the work of healthcare operations analysts and ambulatory data engineers preparing room-utilization, overbook-risk, and clinic-throughput reporting for a clinic network, where mishandling revisions or overlaps shifts daily blocked capacity and flows directly into downstream utilization and capacity reporting."
solution_explanation = "Parse and normalize the export; drop duplicate event ids; reject malformed rows; resolve each booking's effective revision by scanning revisions in descending order and skipping voided ones; keep BOOKED bookings; split each interval into per-day half-open [start, end) pieces; then, per (clinic_id, room_id, calendar_date), merge all active bookings' intervals into a single timeline and count the union minutes; emit only room-days with at least one blocked minute; and report the 12-key quality summary with both consistency identities."
verification_explanation = "The verifier compares the produced CSV and JSON value-for-value against hidden golden expected outputs (exact full-table equality, row count, sort order, uniqueness, schema, integer types, exact 12-key set/order, and the sum), then asserts 52 representative cells covering every planted revision, overlap (P1-P12), and boundary scenario, plus cross-file consistency (JSON total == CSV sum), both contract identities, and anti-cheat checks (symlinks, missing/extra/NaN/typed/reordered/duplicate outputs). Reward is 1.0 only when every check passes."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
