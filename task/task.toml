expert_time_estimate_hours = 6     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "The task assembles analysis-ready ambulatory room-capacity outputs from multiple operational sources with different physical formats and identity conventions. The operational universe is rebuilt from two event feeds (a core CSV reservation feed and a JSON Lines adjustment feed) plus canonical clinic and room directories. The contract requires source-specific normalization into one canonical event ledger; deterministic clinic-first then clinic-scoped room identity resolution (the same room alias can map to different rooms in different clinics); cross-source collision resolution (latest created_ts, greatest event_id string tie-break, VOIDED rows participating); effective revision reconstruction (highest non-VOIDED authoritative revision); and then propagation of that effective state into several related analytical artifacts: an effective-bookings snapshot, a booking-state history ledger, daily room/clinic capacity facts, a per-room-day capacity reconciliation with a conservation invariant, and a categorized quality report. Difficulty arises from the interactions between transformations: one upstream decision (identity, precedence, or revision state) must propagate consistently across all downstream artifacts, and multiple plausible pipeline decompositions exist, only some of which follow the contract. A locally consistent implementation can still be globally wrong because its artifacts agree with each other but disagree with the contract's canonical state. The verifier independently recomputes the canonical pipeline from the public inputs and asserts cross-artifact invariants, so correctness requires reasoning through the whole chain rather than patching one number. The data is synthetic but realistic, modeled on real ambulatory scheduling exports with its revision, amendment, and identity-alias states planted deliberately. This mirrors the work of healthcare operations analysts and ambulatory data engineers preparing room-utilization, overbook-risk, and clinic-throughput reporting from messy operational scheduling data."
solution_explanation = "Parse and normalize both event feeds into one canonical event ledger with preserved source provenance; drop duplicate event ids across the combined universe; reject malformed rows; resolve clinic tokens to canonical clinics via the clinic directory (clinic first), then resolve room tokens to canonical clinic-scoped rooms via the room directory; for each (booking_id, revision) select the authoritative row (latest created_ts, greatest event_id string tie-break, VOIDED rows participating); select each booking's effective revision (highest non-VOIDED authoritative revision); emit the effective-bookings snapshot and the booking-state history ledger; materialize only effective BOOKED intervals as per-day half-open pieces; take the shared room/clinic union per (clinic_id, room_id, calendar_date); emit the daily capacity facts; compute the per-room-day capacity reconciliation (effective booking count, raw interval minutes, blocked minutes, overlap minutes, satisfying raw = blocked + overlap); and produce the categorized quality report with integer metrics over their contract-designated populations."
verification_explanation = "The verifier checks the five produced artifacts (effective_bookings.csv, booking_state_history.csv, daily_room_capacity_facts.csv, capacity_reconciliation.csv, quality_summary.json) against hidden golden expected outputs generated from the authoritative oracle, and against an independent semantic recomputation of the full pipeline from the public inputs alone. It runs exact full-table golden comparison, schema/header/sort/uniqueness/integer-type checks, and anti-cheat/path checks for all five artifacts (symlinks, missing/extra/NaN/typed/reordered/duplicate outputs, no unexpected output files). It independently recomputes canonical normalization, clinic and room identity resolution, cross-source collision resolution, effective revision selection, effective bookings, booking history, day materialization, and the shared room/clinic union. It enforces cross-artifact invariants: history/effective equality, facts/reconciliation bijection with equal blocked minutes, reconciliation conservation (raw = blocked + overlap), effective-booking-count provenance, and quality totals that match artifact-derived sums. It also runs held-out composed scenario checks that combine alias resolution, cross-source collision, cancellation/re-booking, VOIDED handling, zero-length effective bookings, multi-day materialization, and clinic-scoped room alias divergence. Reward is 1.0 only when every check passes."

