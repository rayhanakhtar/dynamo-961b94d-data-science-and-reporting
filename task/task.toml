[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Science and Reporting"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Dataset preparation for analysis"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["implement", "fix", "transform", "validate", "generate"]                # e.g. ["implement", "debug"]
artifact_type = ["single_script_or_program", "dataset_or_tabular_file", "generated_output_artifact"]                 # e.g. ["codebase", "configuration_file"]
expert_time_estimate_hours = 6     # best-case hours for a focused domain expert with the intended insight
difficulty_explanation = "The export mixes many revision states (amendments, cancellations, re-bookings, voided maximum revisions, and same-revision collisions) and capacity is defined over one shared room+clinic timeline. The contract requires resolving each booking to its effective (highest non-voided) revision, attributing blocked minutes only to that revision's room and interval, and taking a strict union of all active effective intervals on the same room across providers/sources. The difficulty is centered on population provenance for the quality summary: section 17 assigns every summary metric to a specific pipeline population, and those populations are distinct from one another and from the population that feeds the fact table. The deduplicated survivors, validated survivors (which still include collision losers), authoritative revision rows, effective revisions, and the effective-booked population each carry a different membership, and a booking whose rows are all malformed never reaches any booking-level metric. A locally reasonable implementation that sources a metric from whichever intermediate collection is at hand — for example counting rows from the collision winners rather than the validated survivors, counting distinct booking ids before malformed rows are removed, or counting a booking as active only when it blocks a positive number of minutes — is internally plausible, schema-valid, sorted, and deterministic, yet differs from the correct summary on a small number of keys while the fact table stays fully correct; each such choice requires tracing deduplication -> validation -> collision -> effective-state -> materialization to diagnose. The export is synthetic but realistic, modeled on real ambulatory scheduling exports with its revision and overlap states planted deliberately. It represents the work of healthcare operations analysts and ambulatory data engineers preparing room-utilization, overbook-risk, and clinic-throughput reporting, where a subtly mis-sourced quality metric flows directly into downstream utilization and capacity reporting."
solution_explanation = "Parse and normalize the export; drop duplicate event ids; reject malformed rows; resolve each booking to its effective revision (the highest-numbered revision whose authoritative content is not voided); keep BOOKED effective bookings; split each effective interval into per-day half-open [start, end) pieces; then, per (clinic_id, room_id, calendar_date), merge all active effective intervals into a single timeline and count the union minutes; emit only room-days with at least one blocked minute; and report the 12-key quality summary over the contract-defined populations, with both consistency identities."
verification_explanation = "The verifier runs 141 checks: 122 parametrized semantic cells plus 19 non-parametrized checks. It compares the produced CSV and JSON value-for-value against hidden golden expected outputs (exact full-table equality, row count, sort order, uniqueness, schema, integer types, exact 12-key set/order, and the summed total), enforces both contract consistency identities and cross-file consistency (JSON total equals the CSV sum), and applies anti-cheat/path checks (symlinks, missing/extra/NaN/typed/reordered/duplicate outputs). The semantic cells cover revision handling, overlap/union, boundaries, collisions, dedup/malformed precedence, and composed state-dependent, cross-stage, state-propagation, provenance-partition, and revision-gap scenarios. Independent checks recompute the fact table (effective-state -> materialization -> union) from the public input alone, and separately recompute every quality-summary value from its contract-specified population (deduplicated survivors, validated survivors, collision winners, effective revisions, the effective-booked population, and the materialized fact population), asserting key-by-key agreement. Reward is 1.0 only when every check passes."

